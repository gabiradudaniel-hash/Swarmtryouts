# Fixed DHCP addresses for the AI decks on SWARM-NET.
# Install on the Pi as /etc/NetworkManager/dnsmasq-shared.d/decks.conf, then restart the AP:
#   sudo nmcli connection down swarm-ap && sudo nmcli connection up swarm-ap
# Scheme: 192.168.50.1<body id>. dnsmasq does not hand these addresses to other devices.
dhcp-host=38:18:2b:c2:0b:48,192.168.50.17,deck7
dhcp-host=38:18:2b:c2:0b:9c,192.168.50.18,deck8
dhcp-host=38:18:2b:c2:11:d0,192.168.50.15,deck5
